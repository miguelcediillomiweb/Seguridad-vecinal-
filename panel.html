<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5cff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Panel de reportes - Seguridad Vecinal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#071b3a,#0b5cff);color:#14213d}.wrap{max-width:900px;margin:auto;padding:14px}.head,.card{background:#fff;border-radius:18px;box-shadow:0 8px 25px #0003}.head{text-align:center;padding:20px;margin-bottom:16px}.head h1{margin:0 0 6px}.head p{margin:0 0 12px;color:#5b6678}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.refresh,.notify,.install,.act{border:0;padding:11px 10px;border-radius:10px;font-weight:800;cursor:pointer}.refresh{background:#0b5cff;color:#fff}.notify{background:#eaf1ff;color:#0757c9}.install{background:#edf9f0;color:#176b2d}.notify:disabled{opacity:.65}.card{padding:16px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.folio{font-weight:900;color:#0b5cff}.badge{padding:5px 9px;border-radius:999px;background:#fff3cd;color:#7a5b00;font-weight:800;font-size:.82rem}.row{margin:9px 0}.label{font-weight:800}.desc{white-space:pre-wrap}.map{display:inline-block;margin-top:8px;padding:9px 12px;border-radius:10px;background:#0b5cff;color:#fff;text-decoration:none;font-weight:800}.photo{display:block;max-width:100%;max-height:320px;border-radius:12px;margin-top:10px}.empty{text-align:center;color:#687589;padding:25px}.error{background:#ffe6e6;color:#a21b1b;border:1px solid #f2bcbc;padding:12px;border-radius:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.act{background:#eef3f8;color:#203047}.act.attend{background:#eaf1ff;color:#0757c9}.act.done{background:#edf9f0;color:#176b2d}.act.close{background:#f2f2f2;color:#424242}.act.share{grid-column:1/-1;background:#fff3cd;color:#7a5b00}@media(max-width:600px){.wrap{padding:10px}.head{padding:16px}.toolbar{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.act.share{grid-column:auto}}
</style></head><body><main class="wrap">
<section class="head"><h1>🚓 Panel de reportes vecinales</h1><p id="accessInfo">Verificando acceso...</p>
<div class="toolbar"><button class="refresh" id="refresh">🔄 Actualizar</button><button class="notify" id="notifyBtn">🔔 Activar notificaciones</button><button class="install" id="installBtn" hidden>📲 Instalar app</button><button class="notify" id="usersBtn" hidden>👥 Gestionar usuarios</button></div></section>
<section id="reports"><div class="empty">Cargando reportes...</div></section>
</main><script type="module" src="panel-v7.js?v=20261002-users6"></script></body></html>
