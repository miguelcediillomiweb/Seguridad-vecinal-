<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear acceso | Seguridad Vecinal</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#071b3a;color:#14213d}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px #0004}input,select,button{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd5e2;font:inherit;margin:7px 0 14px}button{background:#0b5cff;color:#fff;border:0;font-weight:900}.out{background:#edf9f0;padding:14px;border-radius:12px;word-break:break-all}.hide{display:none}.muted{color:#657287}.links{display:grid;gap:10px;margin-top:12px}.links a{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:12px;background:#eaf1ff;color:#0757c9;font-weight:800}</style></head><body><main class="wrap"><section class="card"><h1>🔐 Crear acceso autorizado</h1><p class="muted">Cada policía o administrador tendrá su propio enlace. Puedes cambiar el nombre o revocar el acceso desde gestión.</p><label>Nombre del elemento<input id="nombre" placeholder="Ej. Policía Juan Pérez"></label><label>Tipo de acceso<select id="rol"><option value="policia">👮 Policía</option><option value="admin">🛡️ Administrador</option></select></label><label>PIN inicial de 6 dígitos<input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="Ej. 482731" autocomplete="off"></label><label>Duración<select id="duracion"><option value="31536000000">1 año</option><option value="157680000000">5 años</option><option value="0">Sin caducidad</option></select></label><button id="crear">GENERAR ENLACE INDIVIDUAL</button><div id="resultado" class="out hide"></div><div class="links"><a href="gestion-usuarios.html">👥 Gestión de usuarios</a></div></section></main><script type="module" src="crear-acceso-v2.js?v=20261002-pin1"></script></body></html>
